# ============================================================
# Deploy Spring Boot app to Elastic Beanstalk
# Triggered on every push to main
# Flow: Build JAR → Zip → Upload to S3 → Create EB version → Deploy
# ============================================================

name: Deploy to Elastic Beanstalk

# When this workflow runs
on:
  push:
    branches:
      - main
# Required for OIDC: lets the workflow request an ID token from GitHub
permissions:
  id-token: write    # Required to fetch the OIDC token
  contents: read     # Required for actions/checkout
# Variables used across the workflow
env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  S3_BUCKET: ${{ vars.S3_BUCKET }}
  EB_APPLICATION: ${{ vars.EB_APPLICATION }}
  EB_ENVIRONMENT: ${{ vars.EB_ENVIRONMENT }}

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest                     # Free, standard GitHub runner

    steps:
      # ------------------------------------------------------------
      # 1. Pull the latest code from the repo
      # ------------------------------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # 2. Install Java 21 (Corretto distribution matches Beanstalk)
      # ------------------------------------------------------------
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: 'maven'                       # Cache dependencies for faster builds

      # ------------------------------------------------------------
      # 3. Make Maven wrapper executable (needed on Linux runners)
      # ------------------------------------------------------------
      - name: Grant execute permission to mvnw
        run: chmod +x ./mvnw

      # ------------------------------------------------------------
      # 4. Build the JAR (compile + tests + package)
      # ------------------------------------------------------------
      - name: Build with Maven
        run: ./mvnw clean package

      # ------------------------------------------------------------
      # 5. Prepare the Beanstalk source bundle
      # Beanstalk needs the JAR renamed to 'application.jar' inside a ZIP
      # ------------------------------------------------------------
      - name: Prepare deployment bundle
        run: |
          mkdir -p deploy
          cp target/beanstalk-lab-0.0.1-SNAPSHOT.jar deploy/application.jar
          cd deploy
          zip ../app-bundle.zip application.jar
          cd ..
          ls -la app-bundle.zip

      # ------------------------------------------------------------
      # 6. Generate a unique version label using timestamp + commit SHA
      # ------------------------------------------------------------
      - name: Generate version label
        id: version
        run: |
          VERSION="v-$(date +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}"
          echo "VERSION_LABEL=$VERSION" >> $GITHUB_OUTPUT
          echo "Version label: $VERSION"

      # ------------------------------------------------------------
      # 7. Configure AWS credentials from GitHub secrets
      # ------------------------------------------------------------
      - name: Configure AWS credentials (Via OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # ------------------------------------------------------------
      # 8. Upload the source bundle to YOUR S3 bucket
      # ------------------------------------------------------------
      - name: Upload bundle to S3
        run: |
          aws s3 cp app-bundle.zip \
            s3://${{ env.S3_BUCKET }}/${{ steps.version.outputs.VERSION_LABEL }}.zip
          echo "Uploaded: s3://${{ env.S3_BUCKET }}/${{ steps.version.outputs.VERSION_LABEL }}.zip"

      # ------------------------------------------------------------
      # 9. Register the new application version in Beanstalk
      # ------------------------------------------------------------
      - name: Create Beanstalk application version
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name ${{ env.EB_APPLICATION }} \
            --version-label ${{ steps.version.outputs.VERSION_LABEL }} \
            --source-bundle S3Bucket="${{ env.S3_BUCKET }}",S3Key="${{ steps.version.outputs.VERSION_LABEL }}.zip" \
            --description "Auto-deployed from commit ${GITHUB_SHA::7}"

      # ------------------------------------------------------------
      # 10. Deploy the new version to the environment
      # ------------------------------------------------------------
      - name: Deploy to Beanstalk environment
        run: |
          aws elasticbeanstalk update-environment \
            --application-name ${{ env.EB_APPLICATION }} \
            --environment-name ${{ env.EB_ENVIRONMENT }} \
            --version-label ${{ steps.version.outputs.VERSION_LABEL }}

      # ------------------------------------------------------------
      # 11. Wait for deployment to complete (so the workflow finishes cleanly)
      # ------------------------------------------------------------
      - name: Wait for environment to be ready
        run: |
          aws elasticbeanstalk wait environment-updated \
            --application-name ${{ env.EB_APPLICATION }} \